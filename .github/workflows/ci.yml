name: CES source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ces-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Source integrity and release privacy
        run: python -B tools/release_check.py
      - name: Operator unit and isolated integration tests
        run: python -B -m unittest discover -s operator -p "test_*.py"
      - name: Release-tool regression tests
        run: python -B -m unittest discover -s tools -p "test_release_tools.py"
  native-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Isolated native repository inspection
        shell: pwsh
        run: |
          & ./tests/Inspect.Smoke.ps1
          if (-not $?) { exit 1 }
          exit 0
      - name: Isolated native evidence validation
        shell: pwsh
        run: |
          & ./tests/CodeValidate.Smoke.ps1
          if (-not $?) { exit 1 }
          exit 0

name: CES source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ces-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Source integrity and release privacy
        run: python -B tools/release_check.py
      - name: Operator unit and isolated integration tests
        run: python -B -m unittest discover -s operator -p "test_*.py"
      - name: Release-tool regression tests
        run: python -B -m unittest discover -s tools -p "test_*.py"
      - name: Retained compatibility behavior
        if: runner.os == 'Linux'
        working-directory: construction
        run: python -B -m unittest test_action_registry test_trace_actions test_security_boundary test_sequence_audit test_response_contract test_unified_action_router
      - name: Retained source and authorization audit
        if: runner.os == 'Linux'
        run: python -B construction/security_permission_audit.py --summary
      - name: Install optional compatibility dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-local.txt
          python -m pip check
      - name: Functional module path and catalog integration
        if: runner.os == 'Linux'
        working-directory: construction
        run: python -B -m unittest negative_scenarios.test_cases route_documentation.test_route_help cross_module_regression.test_runner operator_console.test_console
      - name: Retained fixture and schema behavior
        if: runner.os == 'Linux'
        working-directory: construction
        run: python -B -m unittest test_response_contract test_schema_compat test_schema_migration_review
      - name: Optional signature and document dependency regressions
        if: runner.os == 'Linux'
        working-directory: construction
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/construction
        run: python -B -m unittest native_cms.test_protocol signed_pdf.test_protocol xades_certificate.test_protocol lotl_ocsp.test_protocol
  native-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolated native repository inspection
        shell: pwsh
        run: |
          & ./tests/Inspect.Smoke.ps1
          if (-not $?) { exit 1 }
          exit 0
      - name: Native security and path identity guards
        shell: pwsh
        run: |
          & ./tests/CodeSecurity.Boundaries.ps1
          if (-not $?) { exit 1 }
          & ./tests/PathIdentity.Guards.ps1
          if (-not $?) { exit 1 }
          exit 0
      - name: Isolated native evidence validation
        shell: pwsh
        run: |
          & ./tests/CodeValidate.Smoke.ps1
          if (-not $?) { exit 1 }
          exit 0

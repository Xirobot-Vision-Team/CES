name: Bug report
description: Report a reproducible CES problem using synthetic or redacted data.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private repository content, profiles or personal log paths. Use SECURITY.md for sensitive vulnerabilities.
  - type: input
    id: version
    attributes:
      label: CES version and platform
      placeholder: Operator version, Python, PowerShell, Git and OS
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic inputs
      description: Include the command, relevant safe configuration and minimal steps.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted error and verification limits
      description: State what ran and what did not. Do not paste full private logs.
